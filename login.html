<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RESTManager</title>
    <!-- Modern Font -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS Links -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>
    <div class="auth-container">    
        <div class="auth-card glass-card fade-in">
            
            <!-- System Branding Header -->
            <div class="auth-logo">
                <h2>REST<span class="text-primary">Manager</span></h2>
                <p>Sign in to your dashboard</p>
            </div>

            <!-- Error/Success Notification Container -->
            <div id="alert-msg" style="display: none; padding: 10px; margin-bottom: 15px; border-radius: 5px; text-align: center; font-size: 14px;"></div>

            <!-- Login Form -->
            <form class="auth-form" id="loginForm">
                
                <div class="form-group">
                    <label for="email"><i class="fa-regular fa-envelope"></i> Email Address</label>
                    <input type="email" id="email" placeholder="admin@pospro.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <div class="forgot-pass-wrap">
                    <a href="#" class="forgot-pass-link">Forgot Password?</a>
                </div>

                <button type="submit" id="btnSubmit" class="btn btn-primary btn-large">
                    Sign In <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <div class="auth-footer">
                <p>Don't have an account? <a href="signup.html" class="text-primary">Create one</a></p>
            </div>
        </div>
    </div>

    <!-- JS Links -->
    <!-- login.js එක js folder එකේ ඇති නිසා js/login.js විය යුතුය -->
    <script src="js/login.js"></script>
</body>
</html>
</body>

</html>
