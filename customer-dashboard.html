<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Portal - POS System</title>
    <!-- Bootstrap 5 & FontAwesome Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .food-card { border: none; border-radius: 12px; transition: 0.3s; }
        .food-card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .cart-drawer { position: fixed; top: 0; right: -400px; width: 380px; height: 100vh; background: #fff; z-index: 1050; transition: 0.3s; box-shadow: -5px 0 15px rgba(0,0,0,0.1); }
        .cart-drawer.open { right: 0; }
        .cart-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); z-index: 1040; display: none; }
        .cart-overlay.show { display: block; }
    </style>
</head>
<body>

    <!-- 1. Customer Top Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-warning" href="#"><i class="fa-solid fa-utensils me-2"></i>POS Restaurant</a>
            <div class="d-flex align-items-center gap-3">
                <button class="btn btn-outline-warning position-relative" id="btnCart">
                    <i class="fa-solid fa-cart-shopping"></i> My Cart
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="cartBadge">0</span>
                </button>
                <div class="dropdown">
                    <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                        <i class="fa-solid fa-user me-1"></i> <span id="loggedUserName">Customer</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="#" data-bs-toggle="modal" data-bs-target="#reservationModal"><i class="fa-solid fa-chair me-2"></i>Book a Table</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-danger" href="#" id="btnLogout"><i class="fa-solid fa-right-from-bracket me-2"></i>Logout</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <!-- 2. Main Content: Food Menu for Customer -->
    <div class="container my-5">
        <h3 class="fw-bold mb-4">Our Menu</h3>

        <!-- Dynamic Food Items Grid -->
        <div class="row g-4" id="menuGrid">
            <!-- Dynamic Data Load Here -->
        </div>
    </div>

    <!-- 3. Side Cart Slide-in Drawer -->
    <div class="cart-overlay" id="cartOverlay"></div>
    <div class="cart-drawer p-3 d-flex flex-column" id="cartDrawer">
        <div class="d-flex justify-content-between align-items-center border-bottom pb-2">
            <h5 class="m-0"><i class="fa-solid fa-basket-shopping me-2"></i>My Cart</h5>
            <button class="btn-close" id="btnCloseCart"></button>
        </div>
        <div class="cart-items flex-grow-1 overflow-auto my-3" id="cartItemsContainer">
            <p class="text-muted text-center my-4">Cart is empty</p>
        </div>
        <div class="border-top pt-3">
            <div class="d-flex justify-content-between fw-bold fs-5 mb-3">
                <span>Total Amount:</span>
                <span class="text-success" id="cartTotal">Rs. 0.00</span>
            </div>
            <button class="btn btn-success w-100 py-2 fw-bold" onclick="placeCustomerOrder()">Confirm Order</button>
        </div>
    </div>

    <!-- 4. Table Reservation Modal -->
    <div class="modal fade" id="reservationModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fa-solid fa-chair me-2"></i>Reserve a Table</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="reservationForm">
                        <div class="mb-3">
                            <label class="form-label">Date</label>
                            <input type="date" class="form-control" id="resDate" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Time</label>
                            <input type="time" class="form-control" id="resTime" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Guests Count</label>
                            <input type="number" class="form-control" id="resGuests" min="1" max="10" value="2" required>
                        </div>
                        <button type="submit" class="btn btn-warning w-100">Submit Reservation</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- ඔයාගේ js/customer.js එක Link කර ඇත -->
    <script src="js/customer.js"></script>
</body>
</html>
